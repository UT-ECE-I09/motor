<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biped Telemetry</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  #stats { font-family: ui-monospace, monospace; margin-bottom: 12px; }
  table { border-collapse: collapse; font-family: ui-monospace, monospace; }
  td, th { padding: 2px 12px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  canvas { border: 1px solid #ccc; margin-top: 12px; max-width: 100%; }
</style>
</head>
<body>
<h3>Biped telemetry <span id="conn">(connecting)</span></h3>
<div id="stats">waiting for stats…</div>
<table>
  <thead><tr><th>Joint</th><th>pos (deg)</th><th>vel (rad/s)</th><th>current (A)</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<canvas id="chart" width="720" height="200"></canvas>
<script>
const HISTORY = 500, NJ = 9;
const rows = document.getElementById("rows"), stats = document.getElementById("stats");
const chart = document.getElementById("chart"), ctx = chart.getContext("2d");
let cells = [], latest = null, count = 0;
const hist = Array.from({length: NJ}, () => []);

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => document.getElementById("conn").textContent = "(connected)";
  ws.onclose = () => { document.getElementById("conn").textContent = "(disconnected)"; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      const m = JSON.parse(e.data);
      if (m.type === "hello") {
        rows.innerHTML = m.joints.map(n => `<tr><td>${n}</td><td></td><td></td><td></td></tr>`).join("");
        cells = [...rows.rows].map(r => [...r.cells].slice(1));
      } else if (m.type === "stats") {
        stats.textContent = `rx ${m.rx_hz} Hz | lost ${m.lost} | bad ${m.bad} | serial latency p99 ${m.lat_p99_ms} ms | ` +
          `RTT p99 ${m.rtt_p99_ms} ms | bridge CPU ${m.cpu_pct}% | skipped ${m.ws_skipped}`;
      }
      return;
    }
    const v = new DataView(e.data);  // u64 bridge time, u32 seq, u64 t_us, 9 x 3 f32
    if (++count % 10 === 0) ws.send(JSON.stringify({echo: Number(v.getBigUint64(0, true))}));
    latest = v;
    for (let j = 0; j < NJ; j++) {
      const h = hist[j];
      h.push(v.getFloat32(20 + j * 12, true));
      if (h.length > HISTORY) h.shift();
    }
  };
}

function draw() {
  if (latest && cells.length) {
    for (let j = 0; j < NJ; j++) {
      const o = 20 + j * 12;
      cells[j][0].textContent = (latest.getFloat32(o, true) * 57.2958).toFixed(1);
      cells[j][1].textContent = latest.getFloat32(o + 4, true).toFixed(2);
      cells[j][2].textContent = latest.getFloat32(o + 8, true).toFixed(2);
    }
  }
  ctx.clearRect(0, 0, chart.width, chart.height);
  hist.forEach((h, j) => {  // joint positions, +/-0.7 rad full scale
    ctx.strokeStyle = `hsl(${j * 40}, 70%, 45%)`;
    ctx.beginPath();
    h.forEach((y, i) => ctx.lineTo(i * chart.width / HISTORY, chart.height / 2 - y / 0.7 * chart.height / 2));
    ctx.stroke();
  });
  requestAnimationFrame(draw);
}
connect();
draw();
</script>
</body>
</html>
